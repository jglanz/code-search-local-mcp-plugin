rocm-sdk-device-gfx1030 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1031 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1032 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1033 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1034 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1035 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1036 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1100 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1101 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1102 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1103 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1150 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1151 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1152 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1153 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1200 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1201 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx1250 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx908 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx90a = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx942 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-device-gfx950 = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-libraries = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}

[tool.code-search-local.coverage]
line = 90
branch = 90
