[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "build_backend"
backend-path = ["scripts"]

[project]
name = "code-search-local"
version = "0.2.0"
description = "Multi-project local semantic code search with one shared CPU, CUDA or ROCm model service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
authors = [{name = "Farhan Ali Raza"}]
dependencies = [
  "click==8.5.0", "textual==8.2.8", "rich==15.0.0", "aiohttp==3.14.3",
  "pyzmq==27.2.0", "tomlkit==0.15.1", "uv==0.12.18",
]

[project.optional-dependencies]
server = [
  "fastmcp==4.0.7", "starlette==1.7.0", "uvicorn==0.53.0", "watchfiles==1.3.0",
  "sentence-transformers==6.1.0", "huggingface-hub==1.32.0",
  "numpy==2.5.3", "faiss-cpu==1.15.1", "pathspec==1.1.1",
  "tree-sitter==0.26.0", "tree-sitter-language-pack==1.20.0",
]
cpu = ["torch==2.14.0"]
cuda = ["torch==2.14.0"]
rocm = ["torch==2.14.0", "rocm[device-all,libraries]==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-core==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1010==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1011==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1012==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1030==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1031==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1032==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1033==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1034==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1035==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1036==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1100==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1101==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1102==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1103==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1150==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1151==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1152==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1153==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1200==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1201==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx1250==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx908==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx90a==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx942==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-device-gfx950==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "rocm-sdk-libraries==7.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'", "triton-rocm==3.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
  "build==1.6.1", "pytest==9.1.1", "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0", "coverage==7.16.1",
  "ruff==0.16.8", "pipx==1.17.6", "httpx2==2.13.1",
]

[project.scripts]
code-search-local = "code_search_local.cli:main"

[project.urls]
Repository = "https://github.com/jglanz/code-search-local-mcp-plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["code_search_local*"]

[tool.setuptools.package-data]
code_search_local = ["runtime/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: unit tests", "integration: integration tests",
  "real_model: downloads and executes a real embedding model",
  "gpu: requires a physical CUDA or ROCm GPU",
  "clients: requires authenticated real Claude clients",
  "packaging: builds and installs distribution artifacts",
]

[tool.coverage.run]
patch = ["subprocess"]
branch = true
source = ["code_search_local"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
extend-exclude = ["tests/test_data", "tests/fixtures"]
target-version = "py312"
line-length = 100

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}, {extra = "rocm"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true

[[tool.uv.index]]
name = "amd-rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "cpu"},
  {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
  {index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"},
]
triton-rocm = {index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm = {index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-core = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
rocm-sdk-devel = {index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
