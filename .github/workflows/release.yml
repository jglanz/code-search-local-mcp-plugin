name: Release acceptance and publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after all acceptance checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: code-search-local-release
  cancel-in-progress: false
jobs:
  portable:
    uses: ./.github/workflows/ci.yml
  acceptance:
    needs: portable
    # Dedicated runner: both GPUs, authenticated Claude/Codex, user systemd, Python 3.12.
    runs-on: [self-hosted, linux, code-search-local-gpus]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install locked CUDA runtime
        run: |
          python3 -m venv .venv-bootstrap
          .venv-bootstrap/bin/python -m pip install .
          .venv-bootstrap/bin/uv sync --locked --extra server --extra cuda
      - name: Real CUDA and two-client cold-cache acceptance
        run: |
          CODE_SEARCH_GPU_BACKEND=cuda .venv/bin/pytest tests/integration/test_gpu.py
          CODE_SEARCH_REAL_CLIENTS=1 .venv/bin/pytest tests/integration/test_real_clients.py
          CODE_SEARCH_MARKETPLACES=1 .venv/bin/pytest tests/integration/test_marketplaces.py
      - name: Real ROCm acceptance
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-rocm .venv/bin/uv sync --locked --extra server --extra rocm
          CODE_SEARCH_GPU_BACKEND=rocm .venv-rocm/bin/pytest tests/integration/test_gpu.py
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - name: Persistent installation and upgrade acceptance
        run: CODE_SEARCH_SYSTEMD_TESTS=1 .venv/bin/pytest tests/integration/test_systemd_install.py
  publish:
    needs: [portable, acceptance]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
