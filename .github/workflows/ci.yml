name: Tests and distributions
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Bootstrap declared installer
        run: |
          python -m venv .venvs/cpu
          .venvs/cpu/bin/python -m pip install .
          UV_PROJECT_ENVIRONMENT=.venvs/cpu .venvs/cpu/bin/uv sync --locked --extra server --extra cpu
          .venvs/cpu/bin/hatch run cli --version
      - name: Static checks and separate coverage floors
        run: |
          .venvs/cpu/bin/hatch run lint
          .venvs/cpu/bin/hatch run coverage --cov-report=xml
      - name: Build and test all installers
        env:
          CODE_SEARCH_PACKAGING: '1'
        run: |
          .venvs/cpu/bin/hatch build
          .venvs/cpu/bin/hatch run test tests/integration/test_packaging.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/*
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            coverage.json
            coverage.xml
